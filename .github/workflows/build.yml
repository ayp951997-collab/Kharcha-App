name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          # Agar sirf ZIP upload hui hai to pehle unzip karo
          if [ -f KharchaTracker.zip ]; then
            unzip -o KharchaTracker.zip
          fi
          # Project folder ke andar build karo (dono layouts support)
          if [ -d KharchaTracker ]; then
            cd KharchaTracker
          fi
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KharchaTracker-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
