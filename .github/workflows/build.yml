name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo files (diagnostic)
        run: ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip project (agar zip upload hui thi)
        run: |
          if [ -f KharchaTracker.zip ]; then
            unzip -oq KharchaTracker.zip
          fi
          if [ ! -f KharchaTracker/settings.gradle.kts ]; then
            echo "::error::KharchaTracker project repo me nahi mila! KharchaTracker.zip root me upload hui thi?"
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: KharchaTracker

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KharchaTracker-APK
          path: KharchaTracker/app/build/outputs/apk/debug/app-debug.apk
